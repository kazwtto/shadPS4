<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Gradiente de fundo original do ícone -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D1543E" />
      <stop offset="50%" stop-color="#A63A29" />
      <stop offset="100%" stop-color="#6E2116" />
    </linearGradient>

    <!-- Gradiente marfim/osso para o símbolo -->
    <linearGradient id="omegaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF7" />
      <stop offset="70%" stop-color="#F7EAD6" />
      <stop offset="100%" stop-color="#E3CEB2" />
    </linearGradient>

    <!-- Sombra sutil -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#3A0E08" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Fundo -->
  <rect width="512" height="512" fill="url(#bgGrad)" />

  <!-- Silhueta fiel à referência -->
  <g filter="url(#dropShadow)" transform="translate(0, 6)">
    <path fill="url(#omegaGrad)" d="
      M 256 76
      C 154 76, 98 148, 98 232
      C 98 296, 134 348, 198 370
      L 198 386
      C 156 382, 122 372, 118 352
      L 106 352
      L 106 426
      L 224 426
      L 220 356
      C 172 336, 152 288, 152 232
      C 152 164, 194 114, 256 114
      C 318 114, 360 164, 360 232
      C 360 288, 340 336, 292 356
      L 288 426
      L 406 426
      L 406 352
      L 394 352
      C 390 372, 356 382, 314 386
      L 314 370
      C 378 348, 414 296, 414 232
      C 414 148, 358 76, 256 76
      Z
    " />
  </g>
</svg>